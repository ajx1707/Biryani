services:
  - type: web
    name: the-madras-biryani
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: ADMIN_PASSWORD
        value: madras123
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: madras-biryani-db
          property: connectionString

databases:
  - name: madras-biryani-db
    plan: free
    databaseName: madras_biryani
    user: biryani_admin
