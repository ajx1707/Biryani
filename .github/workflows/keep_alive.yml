name: Keep Render App Alive

on:
  schedule:
    # Runs every 10 minutes, 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          echo "Sending keep-alive ping to Render service..."
          curl -s -f -m 30 "https://the-madras-biryani.onrender.com/ping" || curl -s -f -m 30 "https://the-madras-biryani.onrender.com/" || true
          echo "Ping completed successfully."
